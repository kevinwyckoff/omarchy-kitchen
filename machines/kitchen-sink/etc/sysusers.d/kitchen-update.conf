# /etc/sysusers.d/kitchen-update.conf
# A system group with no members and no password. kitchen-update adds it, with
# setpriv, to the nightly omarchy-update process tree only; the per-run rule
# /etc/sudoers.d/98-kitchen-update names this group, so only that tree gets
# sudo without a password. Never add a user to it.
g kitchen-update -
