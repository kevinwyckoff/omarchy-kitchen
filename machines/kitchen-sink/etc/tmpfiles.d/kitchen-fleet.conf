# /etc/tmpfiles.d/kitchen-fleet.conf
# Kernel same-page merging for the Little Heroes UE fleet (README.md, "The UE
# fleet"). The fleet's own systemd units mark their memory mergeable
# (MemoryKSM=yes): ten headless editors hold about 12 GB of identical pages
# between them, and ksmd folds them into one copy. The advisor paces ksmd to
# scan everything marked in about 30 s, with at most one core. Nothing else on
# this machine marks memory mergeable, so ksmd sleeps when no fleet runs.
w /sys/kernel/mm/ksm/advisor_mode - - - - scan-time
w /sys/kernel/mm/ksm/advisor_target_scan_time - - - - 30
w /sys/kernel/mm/ksm/advisor_max_cpu - - - - 100
w /sys/kernel/mm/ksm/run - - - - 1
