# /etc/tmpfiles.d/kitchen-update.conf
# A nightly sudo grant that outlived its run (a crash, a power cut) is removed
# at boot. "r!" acts only with --boot, so installing this file removes nothing.
r! /etc/sudoers.d/98-kitchen-update
r! /etc/sudoers.d/.kitchen-update.*
# Where the one-shot force-idle flag for a supervised run goes.
d /run/kitchen-update 0755 root root -
