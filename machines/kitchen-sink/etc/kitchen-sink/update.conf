# /etc/kitchen-sink/update.conf: settings for the nightly updater (kitchen-update).
#
# Bash KEY=VALUE, sourced as root by kitchen-update, safe-to-update, preflight
# and postflight. They only read it when it is owned by root and not writable
# by anyone else. Every key has the same built-in default in the scripts, so a
# missing file, or a missing key, means "the value below".

# The desktop account whose `omarchy update` this runs.
DESKTOP_USER=kevinwyckoff

# ---- S2: activity (safe-to-update) -------------------------------------------
# Keyboard, mouse and touch must be silent this long (seconds) before a run.
QUIET_SECS=600
# No keystroke into any terminal (/dev/pts atime) for this long.
TTY_IDLE_SECS=1800
# No Claude Code or Pi transcript entry for this long.
AGENT_IDLE_SECS=1800
# 16 threads; an idle kitchen-sink sits at a load of about 0.05.
LOAD5_MAX=2.0
# /proc/pressure "some avg60", in percent.
PSI_CPU_MAX=5
PSI_IO_MAX=10
# nvidia utilization.gpu averaged over 5 samples, in percent.
GPU_MAX=15
# Network traffic over 5 s on any interface but lo; 1 MiB/s catches downloads.
NET_MAX_BYTES_PER_SEC=1048576

# ---- S1 and S3: compatibility -------------------------------------------------
# The kitchen build must stay pinned with IgnorePkg while it carries the
# Secure Boot engine that edge's omarchy-dev lacks.
PIN_PACKAGES="omarchy-dev omarchy-settings-dev"
# While the pin holds a newer omarchy-dev back, hold nights that would update
# the desktop stack the pinned build was written against.
DRIFT_REGEX='^(hyprland.*|quickshell|uwsm|xdg-desktop-portal-hyprland)$'
# Kernel, nvidia and boot-chain packages: "install" behind the strict postflight
# (the default, as decided), or "defer" to hold those nights for an attended run.
BOOT_CHAIN_POLICY=install
# Arch news: "hold-all" holds on any item newer than the last success (as
# decided); "keywords" holds only on manual-intervention items and titles that
# name an installed package.
NEWS_POLICY=hold-all
# More than this many days since the last successful update: do it attended.
STALE_DAYS=21
# Free space on / must be at least max(ROOT_MIN_GIB, 3 x the download).
ROOT_MIN_GIB=10
# A UKI rebuild needs the largest boot file plus this much free on the ESP.
ESP_MARGIN_MIB=64
# The package with the thermal events' patched nct6775. It builds only for the
# kernels its dkms.conf's BUILD_EXCLUSIVE_KERNEL names; this regex stands in
# when that file can't be read. A pending kernel outside it is an info line,
# never a hold: the machine boots the in-tree driver and loses only the events.
THERMAL_DKMS_PKG=nct6775-notify-dkms
THERMAL_KERNEL_REGEX='^7\.2\.'

# ---- S4 to S6: the grant and the run -----------------------------------------
# The sudoers rule's NOTAFTER, counted from when it is written.
GRANT_MINUTES=120
# omarchy-update gets TERM after this long, then KILL this much later. TERM
# reaches omarchy-update only, and bash runs its trap after the current phase,
# so a pacman transaction is never interrupted. kitchen-update.service's
# TimeoutStartSec must cover these, QUIET_SECS and PACMAN_WAIT_SECS.
UPDATE_TIMEOUT=100m
UPDATE_KILL_AFTER=5m

# ---- S7: postflight -------------------------------------------------------------
# How long to wait for a pacman still running after the update's timeout.
# (kitchen-update.service's TimeoutStartSec covers this; raise both together.)
PACMAN_WAIT_SECS=1200
# How long to wait for the Secure Boot path watchers to finish re-sealing.
WATCHER_WAIT_SECS=120
# Failed units that are known and harmless here (NvPCR on the AMD fTPM).
KNOWN_FAILED_UNITS="systemd-pcrlogin@1000.service systemd-pcrproduct.service systemd-tpm2-setup-early.service"
# Where limine-mkinitcpio-hook puts each kernel's UKI; %s is the kernel's pkgbase.
UKI_PATTERN=/boot/EFI/Linux/omarchy_%s.efi
# DKMS modules whose failed build is a WARN, not a FAIL: nothing needs them to
# boot. nvidia is never one of them (a black screen).
DKMS_WARN_ONLY="nct6775-notify"

# ---- Schedule and toasts --------------------------------------------------------
# The last timer slot. Used only when the timer's next elapse can't be read:
# a BUSY result at or after this time ends the night as DEFERRED.
LAST_SLOT=05:30
# Toast DONE (normal) and FAILED (critical) through /usr/local/lib/kitchen-sink/notify.
NOTIFY=1
# The update restarts the shell; give its notification server this long to return.
NOTIFY_WAIT_SECS=60
