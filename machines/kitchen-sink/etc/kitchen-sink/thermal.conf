# /etc/kitchen-sink/thermal.conf: settings for kitchen-thermal, the thermal event daemon.
#
# KEY=VALUE lines in the style of checkup.conf. The daemon reads them without
# running them (one word per value; quote a list), as root, so keep this file
# owned by root and not writable by others (it is ignored otherwise). Every
# setting has a built-in default, shown commented out below; uncomment a line
# to change it, then `sudo systemctl reload kitchen-thermal`.
#
# Temperatures are in °C. The daemon never writes a Super I/O limit, pwm or
# SmartFan setting; the only thing it programs is the NVMe drives' own
# temperature thresholds, and only for the drives named in NVME_ARM.

# ---- CPU ----------------------------------------------------------------------

# The CPU's own temperature, as the Super I/O reads it over SB-TSI (temp13 on
# kitchen-sink, found by this label). A 7700X boosts up to 95 °C by design.
#CPU_SENSOR_LABEL=TSI0_TEMP
#CPU_WARN=90
#CPU_CRIT=95
# A level clears at or below its threshold minus this
#CPU_HYST=5
# A level is reached only after the reading has stayed at or above it this long
#CPU_DWELL_SECS=10
# The crit toast (and journal priority err) comes only after crit has held this long
#CPU_CRIT_TOAST_SECS=60

# ---- Super I/O ----------------------------------------------------------------

#SUPERIO_NAME=nct6799
# Chip alarms that only go to the journal (priority info), never to hooks.
# temp7 is SMBUSMASTER 0, a CPU proxy the BIOS set to 80/75 °C.
#JOURNAL_ONLY_ALARMS="temp7_alarm"
# Without the patched nct6775 (no notify_interval), read the sensors this often
# and report `thermal-monitor degraded`
#DEGRADED_POLL_SECS=10

# ---- fans ---------------------------------------------------------------------

# fan-ramp: once per this many percent of pwm change, at most once per MIN_SECS per fan
#FAN_RAMP_STEP_PCT=10
#FAN_RAMP_MIN_SECS=5
# fan-stall: a fan at 0 rpm while its pwm is at least this, for STALL_SECS
#FAN_STALL_PWM_MIN=20
#FAN_STALL_SECS=5
# Fans that must spin, as "fan2 fan5 fan7". Empty watches every fan once it has
# been seen spinning, so a fan that is already dead at start goes unnoticed.
#FAN_WATCH=""
# There is deliberately no FAN_MIN setting: the daemon never writes fanN_min.

# ---- NVMe ---------------------------------------------------------------------

# The drives whose temperature events to switch on, by role: the names given to
# serials in checkup.conf's NVME_SERIALS, for example "system data". (A serial
# works too, but a role keeps serials in one place.) Only add a drive the
# read-only probe (sudo nvme-health.py --probe) reported as Case A: its
# controller has an AER outstanding on the stock kernel. The daemon checks
# again and leaves a Case B drive alone. Empty arms nothing and writes nothing
# to any drive.
#NVME_ARM=""
# The SMART critical-warning bits to enable in the AEN configuration (FID 0Bh):
# 0x02 temperature; 0x07 also available spare and reliability (nvme-health)
#NVME_AEN_MASK=0x02
# Per role: WARN and CRIT start the warn and crit levels; below CLEAR ends them.
# They must be in order, CLEAR < WARN < CRIT, within 0-120 °C: out of order they
# would program a threshold that fires at once, so a drive with that role is
# then left unarmed (and the journal says why). A role without its own lines
# takes the system drive's.
#NVME_system_WARN=70
#NVME_system_CRIT=80
#NVME_system_CLEAR=65
#NVME_data_WARN=65
#NVME_data_CRIT=75
#NVME_data_CLEAR=60
# crit drops back to warn at CRIT minus this (1-30)
#NVME_HOT_HYST=5

# ---- GPU (NVML) ---------------------------------------------------------------

#NVML=1
#NVML_LIBRARY=libnvidia-ml.so.1
# After NVML fails (an nvidia update waiting for its reboot), try again this often
#NVML_RETRY_SECS=600
#GPU_HOT=85
#GPU_HYST=5
# NVML has no temperature event, so these are the only GPU polling: the event
# wait times out after this many seconds while the GPU is busy (below P8) or
# hot (gpu-hot has not ended), or throttling. At idle it never times out unless
# IDLE_HEARTBEAT is set.
#GPU_BUSY_TIMEOUT=15
#GPU_THROTTLE_TIMEOUT=5
#GPU_IDLE_HEARTBEAT=0
# gpu-throttle ends after this long without a throttle counter moving
#GPU_THROTTLE_QUIET_SECS=30
#GPU_COALESCE_MS=250

# ---- kernel log backstop ------------------------------------------------------

# Follow the kernel log for NVRM Xid, "fallen off the bus" and amdgpu CTF lines
#KMSG_FOLLOW=1
#JOURNALCTL=/usr/bin/journalctl
# The same Xid from NVML and the kernel log within this many seconds is one event
#XID_DEDUP_SECS=2

# ---- delivery -----------------------------------------------------------------

# Hooks: `omarchy-hook thermal <event> <state> key=value...`, run in this user's
# own manager while it runs (user@UID.service: logged in, or lingering). Empty
# means checkup.conf's DESKTOP_USER.
#HOOKS=1
#HOOK_USER=""
#HOOK_CMD=/usr/bin/omarchy-hook
# Seconds a hook may run
#HOOK_TIMEOUT=60
# At most this many hooks a minute in all, and per event and sensor
#HOOK_RATE_PER_MIN=30
#HOOK_KEY_RATE_PER_MIN=12
#HOOK_QUEUE_MAX=32
#SYSTEMD_RUN=/usr/bin/systemd-run
# Asked whether the hook user's manager is running
#SYSTEMCTL=/usr/bin/systemctl
# Events that also toast, as event or event:level|kind|state. A CPU crit toasts
# only once held for CPU_CRIT_TOAST_SECS.
#NOTIFY_EVENTS="fan-stall nvme-hot:crit cpu-hot:crit gpu-xid thermal-monitor:degraded"
#NOTIFY_CMD=/usr/local/lib/kitchen-sink/notify
# At most one toast per event and sensor this often
#NOTIFY_MIN_SECS=600
#STATE_FILE=/run/kitchen-thermal/state.json
