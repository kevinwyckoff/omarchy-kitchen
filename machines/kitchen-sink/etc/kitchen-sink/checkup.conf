# /etc/kitchen-sink/checkup.conf: settings for kitchen-checkup, the daily check-up.
#
# Bash KEY=VALUE lines, sourced by /usr/local/sbin/kitchen-checkup as root, so
# keep this file owned by root and not writable by others (it is ignored
# otherwise). Every setting has a built-in default, shown commented out below;
# uncomment a line to change it. The thresholds are first guesses from the
# 2026-09-28 baseline.

# ---- who and where ------------------------------------------------------------

# The desktop user: gets the toast; their user units and reboot marker are checked
#DESKTOP_USER=kevinwyckoff
#REPORT_DIR=/var/log/kitchen-checkup
#STATE_DIR=/var/lib/kitchen-checkup
#CACHE_DIR=/var/cache/kitchen-checkup
#KEEP_REPORTS_DAYS=90

# ---- toast --------------------------------------------------------------------

#NOTIFY=1
# Also toast (low urgency) when everything is OK
#NOTIFY_WHEN_OK=1
# How long to wait for the user's session bus, for a catch-up run at boot
#NOTIFY_WAIT_SECS=180
#NOTIFY_CMD=/usr/local/lib/kitchen-sink/notify
#NVME_HELPER=/usr/local/lib/kitchen-sink/nvme-health.py
#JOURNAL_IGNORE=/etc/kitchen-sink/journal-ignore.regex

# ---- Secure Boot and the kitchen pin ------------------------------------------

#SB_ENGINE=/usr/share/omarchy/install/secureboot/bin/omarchy-secureboot
# IgnorePkg must hold these while the kitchen build is installed
#PIN_PACKAGES="omarchy-dev omarchy-settings-dev"
# The pre-refresh-pacman hook that puts the pin back, relative to the user's home
#PIN_HOOK=.config/omarchy/hooks/pre-refresh-pacman.d/10-kitchen-pin

# ---- units, services and timers -----------------------------------------------

# Failed units that are known and harmless (NvPCR on the AMD fTPM)
#KNOWN_FAILED_UNITS="systemd-pcrlogin@1000.service systemd-pcrproduct.service systemd-tpm2-setup-early.service"
# Services that should be running (WARN when not)
#EXPECT_ACTIVE="sshd.service systemd-timesyncd.service ufw.service ollama.service"
# Timers that should be enabled (INFO when not)
#EXPECT_TIMERS="btrfs-scrub@-.timer btrfs-scrub@mnt-data.timer kitchen-checkup.timer kitchen-update.timer"

# ---- disks --------------------------------------------------------------------

#DATA_MOUNT=/mnt/data
#DATA_SOURCE=/dev/mapper/omarchy_data
# btrfs filesystems whose error counters and scrubs are checked
#BTRFS_MOUNTS="/ /mnt/data"
# NVMe drives by serial, as serial:name, for example "S0123:system S4567:data".
# Empty checks every drive found, named by its serial.
#NVME_SERIALS=""

# / free space (btrfs estimate), in GiB
#ROOT_WARN_GIB=40
#ROOT_FAIL_GIB=15
# /boot free space in MiB; the UKI is about 271 MiB and an update writes a new one
#BOOT_WARN_MIB=700
#BOOT_FAIL_MIB=350
#DATA_WARN_PCT=90
# NVMe: percentage of rated life used, and composite temperature in C
#NVME_USED_WARN=80
#NVME_TEMP_WARN=70
#SCRUB_WARN_DAYS=40

# ---- updates ------------------------------------------------------------------

# Days since the last full system upgrade
#UPDATE_WARN_DAYS=7
#UPDATE_FAIL_DAYS=21
# The nightly updater's state, and when a busy streak becomes a WARN
#UPDATE_STATUS=/var/lib/kitchen-update/status.json
#UPDATE_LAST_SUCCESS=/var/lib/kitchen-update/last-success
# Kept by the updater from the night it asks for a reboot until the next boot
#UPDATE_REBOOT_PENDING=/var/lib/kitchen-update/reboot-pending
#UPDATE_BEHIND_WARN_NIGHTS=3
#UPDATE_UNIT=kitchen-update.service
#UPDATE_TIMER=kitchen-update.timer
# Exists only during a nightly run; anything else is a leftover grant (FAIL)
#UPDATE_GRANT=/etc/sudoers.d/98-kitchen-update
# The group that rule trusts; outside a run no process may carry it (FAIL)
#UPDATE_GROUP=kitchen-update
# Left by the updater when the boot chain failed its checks; FAIL, do not
# reboot, until the updater's checks pass again
#UPDATE_BOOT_CHECK=/var/lib/kitchen-update/boot-check
# Where each installed kernel's UKI is; %s is the kernel's pkgbase
#UKI_PATTERN=/boot/EFI/Linux/omarchy_%s.efi
