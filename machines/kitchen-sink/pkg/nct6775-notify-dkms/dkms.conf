# DKMS build of the patched nct6775 driver family. The PKGBUILD fills in the
# version; the sources in this directory are already patched.
PACKAGE_NAME="nct6775-notify"
PACKAGE_VERSION="@PKGVER@"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

# All three or none: they share a struct whose layout the patches change.
# /updates/dkms wins over the in-tree copies in depmod's search order.
BUILT_MODULE_NAME[0]="nct6775-core"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="nct6775"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="nct6775-i2c"
DEST_MODULE_LOCATION[2]="/updates/dkms"

AUTOINSTALL="yes"

# The sources are Linux 7.2.5's. Any other kernel series is skipped without an
# error, and the in-tree driver (no notifications, no dump) loads instead.
# refresh.sh moves the sources and this line to a new series.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
