# nct6775-notify-dkms: defaults for the patched nct6775 driver.
#
# To change them, copy this file to /etc/modprobe.d/nct6775-notify.conf (it
# then replaces this one) and reload the driver, or write the values at
# runtime under /sys/module/nct6775_core/parameters/.
#
# notify_interval    ms between in-kernel samples, 250-10000 (other values are
#                    clamped); 0 turns notification off. The driver's own
#                    default is 0, so this line is what switches it on
# notify_pwm_delta   smallest pwm change (0-255) that wakes poll() readers
# notify_temp_delta  smallest temperature change (millidegrees C) that wakes
#                    poll() readers; 1000 lets the CPU (TSI0) reading drive
#                    kitchen-thermald's levels
#
# On a kernel the package does not cover, the in-tree driver loads and logs
# "unknown parameter ... ignored" for these; it works as before.
options nct6775_core notify_interval=1000 notify_pwm_delta=3 notify_temp_delta=1000

# Read-only register dump in /sys/kernel/debug/nct6775/<device>/ (sio_regs,
# hm_regs). Off by default; enable it for one read at runtime instead:
#   echo 1 > /sys/module/nct6775/parameters/dump
# options nct6775 dump=1
